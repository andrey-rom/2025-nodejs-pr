<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TEST</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>live server is working</h1>
    <p>change file and the page will reload automatically</p>
    <p class="updated">last updated: <span id="time"></span></p>
    <p class="text">Text Text Text HI</p>
    <script>
      document.getElementById("time").textContent =
        new Date().toLocaleDateString("en-EN", {
          year: "numeric",
          month: "long",
          day: "numeric",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
        });
    </script>
  </body>
</html>
